<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stair dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --series-1: #2a78d6; --up: #006300; --down: #d03b3b;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --neutral: #898781;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --series-1: #3987e5; --up: #0ca30c; --down: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --series-1: #3987e5; --up: #0ca30c; --down: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
       font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 18px; }
header h1 { font-size: 20px; margin: 0 8px 0 0; letter-spacing: -0.01em; }
header .spacer { flex: 1; }
.meta { color: var(--ink-2); font-size: 13px; }
button.theme { background: var(--surface); color: var(--ink-2); border: 1px solid var(--border);
               border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.banner { border: 1px solid var(--border); border-left: 4px solid var(--critical); background: var(--surface);
          border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.banner.serious { border-left-color: var(--serious); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.tile { padding: 14px 16px; }
.tile .label { color: var(--ink-2); font-size: 12px; margin-bottom: 6px; }
.tile .value { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.tile .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
.card { padding: 16px; margin-bottom: 18px; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card .hint { color: var(--ink-2); font-size: 12px; margin: 0 0 12px; }
.card h3 { font-size: 13px; color: var(--ink-2); font-weight: 600; margin: 18px 0 8px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; margin: 8px 0 4px; }
.facts > div > span { display: block; color: var(--ink-2); font-size: 12px; }
.facts > div > b { font-weight: 600; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--ink-2); font-weight: 500; font-size: 12px; padding: 6px 10px;
     border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td.num, th.num { text-align: right; }
tr:hover td { background: var(--wash); }
.empty { color: var(--muted); padding: 10px 2px; }
.up { color: var(--up); } .down { color: var(--down); }
.badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
         border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; font-weight: 600; color: var(--ink);
         background: var(--surface); white-space: nowrap; }
.badge i { font-style: normal; font-size: 11px; line-height: 1; width: 16px; height: 16px; border-radius: 50%;
           display: inline-flex; align-items: center; justify-content: center; color: #fff; }
.badge.good i { background: var(--good); } .badge.warning i { background: var(--warning); color: #0b0b0b; }
.badge.serious i { background: var(--serious); } .badge.critical i { background: var(--critical); }
.badge.neutral i { background: var(--neutral); }
.tile .value .badge { font-size: 15px; padding: 4px 12px 4px 8px; }
.side { font-weight: 600; font-size: 12px; letter-spacing: 0.02em; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 200px; overflow: visible; }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
           border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
           box-shadow: 0 4px 16px rgba(0,0,0,0.12); white-space: nowrap; display: none; z-index: 2; }
.tooltip b { font-variant-numeric: tabular-nums; }
.events td { font-size: 12px; }
.events td.payload { white-space: normal; color: var(--ink-2); word-break: break-word; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>stair</h1>
    <span id="env"></span>
    <span id="bot"></span>
    <span id="exch"></span>
    <span class="spacer"></span>
    <span class="meta" id="quote"></span>
    <span class="meta" id="updated"></span>
    <button class="theme" id="theme" type="button">Theme: auto</button>
  </header>
  <div id="banners"></div>
  <section class="tiles" id="tiles"></section>

  <section class="card">
    <h2>Open positions</h2>
    <p class="hint">Live from the exchange, all symbols, refreshed every few seconds.</p>
    <div class="scroll" id="positions"></div>
  </section>

  <section class="card" id="cycle"></section>

  <section class="card">
    <h2>Closed cycles</h2>
    <p class="hint">Net result per cycle = realized PnL + funding − fees. The line shows the running total.</p>
    <div class="chart" id="chart"></div>
    <div class="scroll" id="closed"></div>
  </section>

  <section class="card">
    <h2>Journal</h2>
    <p class="hint">Latest bot events, newest last.</p>
    <div class="scroll" id="events"></div>
  </section>
</main>
<script>
"use strict";
const STATES = {
  HEDGED: ["good", "✓", "Hedged"], WAIT_SIGNAL: ["neutral", "○", "Waiting for signal"],
  WAIT_ENTRY: ["neutral", "○", "Entry order working"], ENTRY_PARTIAL: ["warning", "!", "Entry partly filled"],
  SINGLE_POSITION: ["warning", "!", "Unhedged position"], HEDGE_PENDING: ["warning", "!", "Hedge working"],
  PAUSED: ["serious", "‖", "Paused"], CLOSING: ["serious", "■", "Closing"],
  RECOVERY: ["critical", "✕", "Recovery"], FINISHED: ["neutral", "○", "Finished"],
};
const ADD_STATES = { CLOSED: "neutral", OPEN: "warning", PENDING_ENTRY: "neutral", PARTIAL_ENTRY: "warning",
                     PENDING_EXIT: "warning", PARTIAL_EXIT: "warning", ERROR: "critical" };
const ICONS = { good: "✓", warning: "!", serious: "■", critical: "✕", neutral: "○" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => (v === null || v === undefined || v === "") ? null : Number(v);
function fmt(v, dp = 4) {
  const n = num(v);
  if (n === null || Number.isNaN(n)) return "–";
  return n.toLocaleString(undefined, { maximumFractionDigits: dp, minimumFractionDigits: 0 });
}
function signed(v, dp = 4) {
  const n = num(v);
  if (n === null || Number.isNaN(n)) return "–";
  if (n === 0) return "0";
  const cls = n > 0 ? "up" : "down", sign = n > 0 ? "+" : "−";
  return `<span class="${cls}">${sign}${fmt(Math.abs(n), dp)}</span>`;
}
const badge = (tone, label, icon) => `<span class="badge ${tone}"><i aria-hidden="true">${icon || ICONS[tone]}</i>${esc(label)}</span>`;
const sideLabel = s => `<span class="side">${esc(s)}</span>`;
const time = ts => ts ? new Date(ts * 1000).toLocaleString() : "–";
function duration(a, b) {
  const s = Math.max(0, Math.round(b - a));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`;
  return `${Math.floor(s / 86400)}d ${Math.floor(s % 86400 / 3600)}h`;
}
function table(cols, rows, empty) {
  if (!rows.length) return `<div class="empty">${esc(empty)}</div>`;
  const head = cols.map(c => `<th class="${c.num ? "num" : ""}">${esc(c.label)}</th>`).join("");
  const body = rows.map(r => `<tr>${cols.map(c => `<td class="${c.num ? "num" : ""}">${c.html(r)}</td>`).join("")}</tr>`).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function renderHeader(d) {
  document.getElementById("env").innerHTML = d.env === "live"
    ? badge("critical", "LIVE · real money") : badge("neutral", "DEMO");
  const age = d.heartbeat ? d.now - d.heartbeat : null;
  document.getElementById("bot").innerHTML = age === null ? badge("neutral", "Bot never ran")
    : age < 10 ? badge("good", "Bot running") : badge("serious", `Bot stopped · ${duration(d.heartbeat, d.now)} ago`);
  const ex = d.exchange;
  document.getElementById("exch").innerHTML = !ex.enabled ? badge("neutral", "Exchange view off")
    : ex.error ? badge("critical", "Exchange unreachable") : badge("good", "Exchange connected");
  const q = ex.quote;
  document.getElementById("quote").textContent = q ? `${d.symbol} bid ${fmt(q.bid)} · ask ${fmt(q.ask)} · mark ${fmt(q.mark)}` : d.symbol;
  document.getElementById("updated").textContent = `updated ${new Date().toLocaleTimeString()}`;
}

function exchangeSides(d) {
  const out = { LONG: 0, SHORT: 0 };
  for (const p of (d.exchange.positions || [])) if (p.symbol === d.symbol) out[p.side] += Number(p.qty);
  return out;
}

function renderBanners(d) {
  const msgs = [];
  if (d.exchange.error) msgs.push(["critical", `Exchange data may be stale: ${d.exchange.error}`]);
  const c = d.cycle;
  if (c && c.recovery) msgs.push(["critical", `Recovery: ${c.recovery}. Fix it, then run <span class="mono">python -m stair ack</span>.`]);
  if (c && d.exchange.positions && !d.exchange.error) {
    const ex = exchangeSides(d);
    const mism = ["LONG", "SHORT"].filter(s => Math.abs(ex[s] - Number(c[s.toLowerCase()].qty)) > 1e-9);
    if (mism.length && !c.recovery) msgs.push(["serious", `Exchange and bot quantities differ on ${mism.join(" and ")} (can be a fill in flight; the bot flags it after two checks).`]);
  }
  if (c && ["SINGLE_POSITION", "ENTRY_PARTIAL", "HEDGE_PENDING"].includes(c.state) && !(d.heartbeat && d.now - d.heartbeat < 10))
    msgs.push(["critical", "The cycle has unhedged exposure and the bot is not running. Hedge triggers only work while <span class=\"mono\">python -m stair run</span> is active."]);
  document.getElementById("banners").innerHTML = msgs.map(([t, m]) =>
    `<div class="banner ${t === "serious" ? "serious" : ""}">${badge(t, t === "critical" ? "Attention" : "Check")} &nbsp;${m}</div>`).join("");
}

function renderTiles(d) {
  const c = d.cycle;
  const st = c ? (STATES[c.state] || ["neutral", "○", c.state]) : ["neutral", "○", "No active cycle"];
  const openUpnl = (d.exchange.positions || []).reduce((s, p) => s + Number(p.unrealized), 0);
  const tiles = [
    ["Cycle state", badge(st[0], st[2], st[1]), c ? `cycle ${esc(c.cycle)} · ${esc(c.first_side || "")} first` : "start with enter"],
    ["Open positions", String((d.exchange.positions || []).length), d.exchange.positions ? `unrealized ${signed(openUpnl, 2)} USDT` : "exchange view off"],
    ["Delta (long − short)", c ? fmt(c.delta) : "–", "coins of directional exposure"],
    ["Spread of averages ES − EL", c && c.spread_of_averages !== null ? fmt(c.spread_of_averages) : "–", "the target the adds widen (R19)"],
    ["Active cycle P&L", c ? signed(c.total, 2) : "–", "USDT, incl. unrealized, after fees"],
    ["Closed cycles net", signed(d.closed_net_total, 2), `${d.closed.length} cycle${d.closed.length === 1 ? "" : "s"} · USDT`],
  ];
  const lv = d.auto_levels;
  if (lv) {
    const sig = lv.signal ? badge("warning", lv.signal.replace("_", " ")) : "";
    tiles.push([`Pivot levels (${esc(lv.interval)})`,
      `<span style="font-size:17px">R ${fmt(lv.resistance)} · S ${fmt(lv.support)}</span>`,
      `${sig} last bar ${new Date(lv.bar_close_ms).toLocaleTimeString()} · vol osc ${fmt(lv.volume_osc, 1)}%`]);
  }
  document.getElementById("tiles").innerHTML = tiles.map(([l, v, s]) =>
    `<div class="tile"><div class="label">${esc(l)}</div><div class="value">${v}</div><div class="sub">${s}</div></div>`).join("");
}

function renderPositions(d) {
  const rows = d.exchange.positions || [];
  document.getElementById("positions").innerHTML = table([
    { label: "Symbol", html: r => esc(r.symbol) },
    { label: "Side", html: r => sideLabel(r.side) },
    { label: "Qty", num: true, html: r => fmt(r.qty) },
    { label: "Entry", num: true, html: r => fmt(r.entry_price) },
    { label: "Mark", num: true, html: r => fmt(r.mark_price) },
    { label: "Unrealized (USDT)", num: true, html: r => signed(r.unrealized, 2) },
    { label: "Liq. price", num: true, html: r => Number(r.liquidation_price) ? fmt(r.liquidation_price) : "–" },
    { label: "Leverage", num: true, html: r => `${r.leverage}×` },
    { label: "Margin", html: r => esc(r.margin_type) },
  ], rows, d.exchange.enabled ? "No open positions on the account." : "Exchange view is off (--no-exchange).");
}

function renderCycle(d) {
  const el = document.getElementById("cycle");
  const c = d.cycle;
  if (!c) {
    el.innerHTML = `<h2>Active cycle</h2><div class="empty">No active cycle. Start one with
      <span class="mono">python -m stair enter long --qty 1 --price &lt;price&gt;</span>.</div>`;
    return;
  }
  const st = STATES[c.state] || ["neutral", "○", c.state];
  const ex = exchangeSides(d);
  const th = c.thresholds;
  const facts = [
    ["State", badge(st[0], st[2], st[1])], ["Started", time(c.created_at)],
    ["First entry", c.first_side ? `${esc(c.first_side)} ${fmt(c.q0)} @ ${fmt(c.e0)}` : "–"],
    ["Entry fee F0", fmt(c.f0, 6)], ["Hedge branch", esc(c.branch || "–")],
    ["Positive threshold", th ? fmt(th.positive) : "–"], ["Negative threshold", th ? fmt(th.negative) : "–"],
    ["Base net spread", c.base_net_spread !== null ? signed(c.base_net_spread, 4) : "–"],
    ["Realized", signed(c.realized, 4)], ["Unrealized", signed(c.unrealized, 4)],
    ["Fees", fmt(c.fees, 6)], ["Funding", signed(c.funding, 6)],
    ["Closed adds result", signed(c.closed_adds_result, 4)], ["Total", signed(c.total, 4)],
  ];
  const books = ["LONG", "SHORT"].map(s => ({ side: s, ...c[s.toLowerCase()], ex: ex[s] }));
  el.innerHTML = `
    <h2>Active cycle ${esc(c.cycle)} · ${esc(c.symbol)}</h2>
    <p class="hint">${esc(c.note || "")}</p>
    <div class="facts">${facts.map(([k, v]) => `<div><span>${esc(k)}</span><b>${v}</b></div>`).join("")}</div>
    <h3>Position sides (bot books vs exchange)</h3>
    <div class="scroll">${table([
      { label: "Side", html: r => sideLabel(r.side) },
      { label: "Bot qty", num: true, html: r => fmt(r.qty) },
      { label: "Exchange qty", num: true, html: r => d.exchange.positions ? fmt(r.ex) : "–" },
      { label: "Match", html: r => !d.exchange.positions ? "–" : Math.abs(r.ex - Number(r.qty)) < 1e-9 ? badge("good", "match") : badge("critical", "differs") },
      { label: "Average", num: true, html: r => fmt(r.avg) },
      { label: "Realized", num: true, html: r => signed(r.realized, 4) },
      { label: "Fees", num: true, html: r => fmt(r.fees, 6) },
    ], books, "")}</div>
    <h3>Adds</h3>
    <div class="scroll">${table([
      { label: "ID", html: r => esc(r.id) }, { label: "Side", html: r => sideLabel(r.side) },
      { label: "Qty", num: true, html: r => `${fmt(r.filled)} / ${fmt(r.qty)}` },
      { label: "Entry", num: true, html: r => fmt(r.price) }, { label: "Exit", num: true, html: r => fmt(r.exit_price) },
      { label: "State", html: r => badge(ADD_STATES[r.state] || "neutral", r.state.replace("_", " ").toLowerCase()) },
      { label: "Result (net)", num: true, html: r => signed(r.result, 4) },
      { label: "Note", html: r => esc(r.note) },
    ], [...c.adds].reverse(), "No adds yet. Levels open adds once the base hedge is formed.")}</div>
    <h3>Levels</h3>
    <div class="scroll">${table([
      { label: "ID", html: r => esc(r.id) }, { label: "Kind", html: r => esc(r.kind) },
      { label: "Source", html: r => r.source === "auto" ? "pivot (auto)" : "manual" },
      { label: "Price", num: true, html: r => fmt(r.price) },
      { label: "Exit", num: true, html: r => r.exit_price ? fmt(r.exit_price) : "default" },
      { label: "Status", html: r => r.add_id ? badge("warning", `busy · ${r.add_id}`) : badge("good", "armed") },
    ], c.levels, "No levels. Add one with python -m stair level add resistance <price>.")}</div>
    <h3>Working orders</h3>
    <div class="scroll">${table([
      { label: "Client ID", html: r => `<span class="mono">${esc(r.client_id)}</span>` },
      { label: "Purpose", html: r => esc(r.purpose) },
      { label: "Side", html: r => `${esc(r.side)} ${sideLabel(r.position_side)}` },
      { label: "Filled / Qty", num: true, html: r => `${fmt(r.filled)} / ${fmt(r.qty)}` },
      { label: "Price", num: true, html: r => r.type === "MARKET" ? "market" : fmt(r.price) },
      { label: "TIF", html: r => esc(r.tif || "") }, { label: "Status", html: r => esc(r.status) },
    ], c.orders, "No working orders.")}</div>`;
}

let chartPoints = [];
function renderChart(d) {
  const box = document.getElementById("chart");
  if (!d.closed.length) { box.innerHTML = ""; chartPoints = []; return; }
  let run = 0;
  chartPoints = d.closed.map((c, i) => ({ i, c, net: Number(c.net), cum: (run += Number(c.net)) }));
  const W = Math.max(box.clientWidth, 280), H = 200, L = 56, R = 16, T = 12, B = 26;
  const ys = chartPoints.map(p => p.cum).concat([0]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const n = chartPoints.length;
  const x = i => n === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const ticks = [lo + (hi - lo) * 0.1, (lo + hi) / 2, hi - (hi - lo) * 0.1]
    .filter(t => Math.abs(y(t) - y(0)) > 14);  // keep tick labels clear of the zero label
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>
    <text class="tick" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t, 2)}</text>`).join("");
  const zero = `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>
    <text class="tick" x="${L - 8}" y="${y(0) + 4}" text-anchor="end">0</text>`;
  const path = chartPoints.map((p, k) => `${k ? "L" : "M"}${x(p.i)},${y(p.cum)}`).join(" ");
  const dots = chartPoints.map(p => `<circle cx="${x(p.i)}" cy="${y(p.cum)}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Running total of closed cycle net results">
      ${grid}${zero}
      <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <line id="xh" y1="${T}" y2="${H - B}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>
      <text class="tick" x="${L}" y="${H - 6}">oldest</text><text class="tick" x="${W - R}" y="${H - 6}" text-anchor="end">newest</text>
      <rect x="${L - 10}" y="0" width="${W - L - R + 20}" height="${H}" fill="transparent" id="hit"/>
    </svg><div class="tooltip" id="tip"></div>`;
  const hit = box.querySelector("#hit"), tip = box.querySelector("#tip"), xh = box.querySelector("#xh");
  const svg = box.querySelector("svg");
  hit.addEventListener("mousemove", ev => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * W / rect.width;
    let best = chartPoints[0];
    for (const p of chartPoints) if (Math.abs(x(p.i) - px) < Math.abs(x(best.i) - px)) best = p;
    xh.setAttribute("x1", x(best.i)); xh.setAttribute("x2", x(best.i)); xh.setAttribute("visibility", "visible");
    tip.innerHTML = `Cycle <b>${esc(best.c.id)}</b> · ${esc(best.c.first_side || "")}<br>${time(best.c.finished)}<br>
      Net <b>${signed(best.net, 4)}</b> USDT<br>Running total <b>${signed(best.cum, 4)}</b> USDT`;
    tip.style.display = "block";
    const left = x(best.i) * rect.width / W;
    tip.style.left = `${Math.min(left + 12, rect.width - tip.offsetWidth - 4)}px`;
    tip.style.top = `${Math.max(0, y(best.cum) * rect.height / H - 30)}px`;
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); });
}

function renderClosed(d) {
  document.getElementById("closed").innerHTML = table([
    { label: "Cycle", html: r => `<span class="mono">${esc(r.id)}</span>` },
    { label: "Symbol", html: r => esc(r.symbol) },
    { label: "First", html: r => r.first_side ? sideLabel(r.first_side) : "–" },
    { label: "Q0 @ E0", num: true, html: r => r.e0 ? `${fmt(r.q0)} @ ${fmt(r.e0)}` : "not filled" },
    { label: "Branch", html: r => esc(r.branch || "–") },
    { label: "Closed", html: r => time(r.finished) },
    { label: "Duration", num: true, html: r => duration(r.started, r.finished) },
    { label: "Adds", num: true, html: r => `${r.adds_closed} · ${signed(r.adds_result, 4)}` },
    { label: "Realized", num: true, html: r => signed(r.realized, 4) },
    { label: "Fees", num: true, html: r => fmt(r.fees, 6) },
    { label: "Funding", num: true, html: r => signed(r.funding, 6) },
    { label: "Net (USDT)", num: true, html: r => `<b>${signed(r.net, 4)}</b>` },
  ], [...d.closed].reverse(), "No closed cycles yet.");
}

function renderEvents(d) {
  document.getElementById("events").innerHTML = `<div class="events">${table([
    { label: "Time", html: r => new Date(r.ts * 1000).toLocaleTimeString() },
    { label: "Cycle", html: r => `<span class="mono">${esc(r.cycle || "–")}</span>` },
    { label: "Event", html: r => r.kind === "signal" ? badge("warning", "signal") : esc(r.kind) },
    { label: "Details", html: r => `<span class="payload mono">${esc(String(r.payload).slice(0, 220))}</span>` },
  ], d.events, "No events yet.")}</div>`;
}

let last = null;
async function refresh() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.status);
    last = d;
    renderHeader(d); renderBanners(d); renderTiles(d); renderPositions(d); renderCycle(d);
    renderChart(d); renderClosed(d); renderEvents(d);
  } catch (err) {
    document.getElementById("banners").innerHTML =
      `<div class="banner">${badge("critical", "Dashboard offline")} &nbsp;Cannot reach the dashboard server (${esc(err.message || err)}). Is <span class="mono">python -m stair dashboard</span> running?</div>`;
  }
}

const themes = ["auto", "light", "dark"];
let theme = "auto";
try { theme = localStorage.getItem("stair-theme") || "auto"; } catch (e) {}
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").textContent = `Theme: ${theme}`;
}
document.getElementById("theme").addEventListener("click", () => {
  theme = themes[(themes.indexOf(theme) + 1) % themes.length];
  try { localStorage.setItem("stair-theme", theme); } catch (e) {}
  applyTheme();
});
applyTheme();
window.addEventListener("resize", () => last && renderChart(last));
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
